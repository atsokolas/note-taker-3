name: Agent Eval

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'server/agentEval/**'
      - 'server/ai/**'
      - 'server/services/collaborativeAgent**'
      - 'server/services/agent**'
      - 'scripts/run_agent_eval.js'
      - 'package*.json'
      - '.github/workflows/agent-eval.yml'
  push:
    branches:
      - main
    paths:
      - 'server/agentEval/**'
      - 'server/ai/**'
      - 'server/services/collaborativeAgent**'
      - 'server/services/agent**'
      - 'scripts/run_agent_eval.js'
      - 'package*.json'
      - '.github/workflows/agent-eval.yml'
  workflow_dispatch:

concurrency:
  group: agent-eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Agent eval (no model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Tests/Server discovers both agentEval test files for every eval trigger.
      # Manual eval dispatch still runs them because Tests has no dispatch trigger.
      - if: github.event_name == 'workflow_dispatch'
        run: npm run test:server -- server/agentEval/
      - run: npm run agent:eval:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-eval
          path: tmp/agent-eval/**
          if-no-files-found: ignore
