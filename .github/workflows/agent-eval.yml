name: Agent Eval

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'server/agentEval/**'
      - 'server/ai/**'
      - 'server/services/collaborativeAgent**'
      - 'server/services/agent**'
      - 'scripts/run_agent_eval.js'
      - 'package*.json'
      - '.github/workflows/agent-eval.yml'
  push:
    branches:
      - main
    paths:
      - 'server/agentEval/**'
      - 'server/ai/**'
      - 'server/services/collaborativeAgent**'
      - 'server/services/agent**'
      - 'scripts/run_agent_eval.js'
      - 'package*.json'
      - '.github/workflows/agent-eval.yml'
  workflow_dispatch:

jobs:
  eval:
    name: Agent eval (no model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/run_server_tests.js server/agentEval/
      - run: npm run agent:eval:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-eval
          path: tmp/agent-eval/**
          if-no-files-found: ignore
