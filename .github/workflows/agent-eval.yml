name: Agent Eval

on:
  pull_request:
    # `labeled` lets a pull request ask for the model path with the live-eval label.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'server/agentEval/**'
      - 'server/ai/**'
      - 'server/services/collaborativeAgent**'
      - 'server/services/agent**'
      - 'scripts/run_agent_eval.js'
      - 'scripts/run_agent_memory_approval_smoke*.js'
      - 'package*.json'
      - '.github/workflows/agent-eval.yml'
  push:
    branches:
      - main
    paths:
      - 'server/agentEval/**'
      - 'server/ai/**'
      - 'server/services/collaborativeAgent**'
      - 'server/services/agent**'
      - 'scripts/run_agent_eval.js'
      - 'package*.json'
      - '.github/workflows/agent-eval.yml'
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      include_live:
        description: 'Also score the configured model path'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      run_approval_smoke:
        description: 'Run live memory approval smoke test against deployed API'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      approval_smoke_action:
        description: 'Memory approval smoke action; reject is safe, approve commits test memory rows'
        required: false
        default: 'reject'
        type: choice
        options:
          - 'reject'
          - 'create'
          - 'approve'

jobs:
  eval:
    name: Agent eval (no model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test server/agentEval/*.test.js
      - run: npm run agent:eval:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-eval
          path: tmp/agent-eval/**
          if-no-files-found: ignore

  live:
    name: Agent eval (model path)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || inputs.include_live == 'true' || contains(github.event.pull_request.labels.*.name, 'live-eval') }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HF_PROVIDER: ${{ vars.HF_PROVIDER || 'groq' }}
      HF_TEXT_MODEL: ${{ vars.HF_TEXT_MODEL || 'openai/gpt-oss-120b' }}
      HF_TEXT_MODEL_FALLBACKS: ${{ vars.HF_TEXT_MODEL_FALLBACKS }}
      HF_AGENT_MODEL_ROUTES_JSON: ${{ vars.HF_AGENT_MODEL_ROUTES_JSON }}
      # The production model and routes, so the run measures what readers get.
      OPENROUTER_TEXT_MODEL: ${{ vars.OPENROUTER_TEXT_MODEL }}
      OPENROUTER_TEXT_MODEL_FALLBACKS: ${{ vars.OPENROUTER_TEXT_MODEL_FALLBACKS }}
      OPENROUTER_AGENT_MODEL_ROUTES_JSON: ${{ vars.OPENROUTER_AGENT_MODEL_ROUTES_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Skip when no model key is configured
        if: ${{ env.HF_TOKEN == '' && env.OPENROUTER_API_KEY == '' }}
        run: echo "No model key is configured; skipping the model-path eval."
      - run: npm run agent:eval -- --verbose
        if: ${{ env.HF_TOKEN != '' || env.OPENROUTER_API_KEY != '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-eval-model
          path: tmp/agent-eval/**
          if-no-files-found: ignore

  approval-smoke:
    name: Live Memory Approval Smoke
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_approval_smoke == 'true' }}
    env:
      AGENT_APPROVAL_SMOKE_BASE_URL: ${{ vars.AGENT_APPROVAL_SMOKE_BASE_URL }}
      AGENT_APPROVAL_SMOKE_TOKEN: ${{ secrets.AGENT_APPROVAL_SMOKE_TOKEN }}
      AGENT_APPROVAL_SMOKE_ACTION: ${{ inputs.approval_smoke_action || 'reject' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Skip smoke when API URL or token is missing
        if: ${{ env.AGENT_APPROVAL_SMOKE_BASE_URL == '' || env.AGENT_APPROVAL_SMOKE_TOKEN == '' }}
        run: echo "AGENT_APPROVAL_SMOKE_BASE_URL or AGENT_APPROVAL_SMOKE_TOKEN is not configured; skipping approval smoke."
      - name: Run approval smoke
        if: ${{ env.AGENT_APPROVAL_SMOKE_BASE_URL != '' && env.AGENT_APPROVAL_SMOKE_TOKEN != '' }}
        run: npm run agent:approval-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-approval-smoke
          path: tmp/agent-approval-smoke-runs/**
          if-no-files-found: ignore
