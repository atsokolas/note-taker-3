name: Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Test scope
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.scope.outputs.server }}
      ui: ${{ steps.scope.outputs.ui }}
      extension: ${{ steps.scope.outputs.extension }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Classifier regression tests
        run: node --test scripts/ci_test_scope.test.js
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            BASE=$(git merge-base "$BASE" "$HEAD") || BASE=""
          fi
          node scripts/ci_test_scope.js "$BASE" "$HEAD"
      - name: Validate test scope
        env:
          SCOPE_SERVER: ${{ steps.scope.outputs.server }}
          SCOPE_UI: ${{ steps.scope.outputs.ui }}
          SCOPE_EXTENSION: ${{ steps.scope.outputs.extension }}
        run: |
          for selected in "$SCOPE_SERVER" "$SCOPE_UI" "$SCOPE_EXTENSION"; do
            case "$selected" in true|false) ;; *) exit 1 ;; esac
          done
  server:
    needs: scope
    if: always() && (needs.scope.result != 'success' || needs.scope.outputs.server != 'false')
    name: Server
    runs-on: ubuntu-latest
    env:
      # Tests that need a database start mongodb-memory-server; keep its binary between runs.
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - name: Verify test scope
        working-directory: .
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SELECTED: ${{ needs.scope.outputs.server }}
        run: test "$SCOPE_RESULT" = success && test "$SELECTED" = true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ hashFiles('package-lock.json') }}
      - run: npm ci --no-audit --no-fund
      - name: Server boots
        run: node scripts/boot_check.js
      - name: Server tests (every node-style file and jest suite)
        run: npm run test:server
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-receipts
          path: tmp/test-receipts/**
          if-no-files-found: ignore
      - name: Offline harnesses
        run: npm run harness:offline

  ui:
    needs: scope
    if: always() && (needs.scope.result != 'success' || needs.scope.outputs.ui != 'false')
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: note-taker-ui
    steps:
      - name: Verify test scope
        working-directory: .
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SELECTED: ${{ needs.scope.outputs.ui }}
        run: test "$SCOPE_RESULT" = success && test "$SELECTED" = true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: note-taker-ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: UI tests
        env:
          CI: true
        run: node ../scripts/test_receipt.js ui --maxWorkers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-receipts
          path: tmp/test-receipts/**
          if-no-files-found: ignore
      - name: UI build
        env:
          # CI=true turns every lint warning into a build failure; the build gate is that it compiles.
          CI: false
        run: npm run build

  extension:
    needs: scope
    if: always() && (needs.scope.result != 'success' || needs.scope.outputs.extension != 'false')
    name: Chrome extension
    runs-on: ubuntu-latest
    steps:
      - name: Verify test scope
        working-directory: .
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SELECTED: ${{ needs.scope.outputs.extension }}
        run: test "$SCOPE_RESULT" = success && test "$SELECTED" = true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      # Only Playwright and its Chromium: the walkthrough stubs every API call.
      - run: npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
      - run: npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
      - name: Pack and walk through the extension in Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: npm run extension:smoke

  gate:
    name: Tests complete
    if: always()
    needs: [scope, server, ui, extension]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every selected gate passed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SERVER_SELECTED: ${{ needs.scope.outputs.server }}
          UI_SELECTED: ${{ needs.scope.outputs.ui }}
          EXTENSION_SELECTED: ${{ needs.scope.outputs.extension }}
          SERVER_RESULT: ${{ needs.server.result }}
          UI_RESULT: ${{ needs.ui.result }}
          EXTENSION_RESULT: ${{ needs.extension.result }}
        run: |
          test "$SCOPE_RESULT" = success
          for component in SERVER UI EXTENSION; do
            selected="${component}_SELECTED"
            result="${component}_RESULT"
            if [ "${!selected}" = true ]; then
              test "${!result}" = success || exit 1
            else
              test "${!selected}" = false && test "${!result}" = skipped || exit 1
            fi
          done
